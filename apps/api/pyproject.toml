[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xianyu-ai-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "sqlalchemy[asyncio]>=2.0.43,<3",
  "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1", "alembic>=1.16,<2", "redis>=6.4,<7",
  "pydantic-settings>=2.10,<3", "httpx>=0.28,<1", "PyJWT>=2.10,<3",
  "argon2-cffi>=25.1,<26", "python-multipart>=0.0.20,<1", "email-validator>=2.2,<3"
  , "cryptography>=45,<46", "qrcode[pil]>=7.4.2,<9", "requests>=2.31,<3", "websockets>=13,<16",
]
[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702", "B008"]
